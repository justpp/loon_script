# Loon 主配置片段：QQ音乐 / 腾讯动漫 去广告与双代理开关
#
# 合并方式：
#   1. [Proxy Group] 追加到主配置的 [Proxy Group] 段末尾；
#   2. [Rule] 整段粘贴到主配置 [Rule] 的最前面（必须在 DOMAIN-SUFFIX、GEOIP、FINAL 之前）；
#   3. [Plugin] 追加到主配置的 [Plugin] 段，把 URL 换成实际地址。
#
# 开关语义：
#   QQMusic      = PROXY / DIRECT   控制 QQ音乐 专属域名是否走代理
#   TencentComic = PROXY / DIRECT   控制腾讯动漫 专属域名是否走代理
#   广告过滤与开关无关，两种模式下都生效。

[Proxy Group]

# 代理侧总选择。若主配置已有名为 PROXY 的组，删除这一行并复用。
PROXY = select, <自动选择组名或节点名>, DIRECT

QQMusic = select, PROXY, DIRECT
TencentComic = select, PROXY, DIRECT

[Rule]

# ---------- 广告域（必须在分流规则之前）----------
DOMAIN,ad.tencentmusic.com,REJECT
DOMAIN,adcdn.tencentmusic.com,REJECT
DOMAIN,adcdn6.tencentmusic.com,REJECT
DOMAIN,adstats.tencentmusic.com,REJECT
DOMAIN,adexpo.tencentmusic.com,REJECT
DOMAIN,adclick.tencentmusic.com,REJECT
DOMAIN,tmead.y.qq.com,REJECT
DOMAIN,tmeadbak.y.qq.com,REJECT
DOMAIN,tmeadcomm.y.qq.com,REJECT
DOMAIN,tmeadquic.y.qq.com,REJECT
DOMAIN,us.l.qq.com,REJECT
DOMAIN,p.l.qq.com,REJECT
DOMAIN,sdk.e.qq.com,REJECT
DOMAIN,tangram.e.qq.com,REJECT
DOMAIN,gdt.qq.com,REJECT
DOMAIN,v.gdt.qq.com,REJECT
DOMAIN,xs.gdt.qq.com,REJECT
DOMAIN,pgdt.gtimg.cn,REJECT
DOMAIN,adsmind.gdtimg.com,REJECT
DOMAIN,imtmp.net,REJECT
DOMAIN,sdkreport.e.qq.com,REJECT
DOMAIN,rdelivery.qq.com,REJECT

# ---------- QQ音乐：专属业务域 → QQMusic 开关 ----------
# 可选：若代理出口在海外导致播放/下载受限，取消下面两行注释，让音频 CDN 始终直连。
# 它们必须位于后面的 qqmusic.qq.com 分流规则之前，取消注释时不要移动位置。
# DOMAIN-SUFFIX,stream.qqmusic.qq.com,DIRECT
# DOMAIN,aqqmusic.tc.qq.com,DIRECT

DOMAIN,u.y.qq.com,QQMusic
DOMAIN,c.y.qq.com,QQMusic
DOMAIN,i.y.qq.com,QQMusic
DOMAIN,y.qq.com,QQMusic
DOMAIN-SUFFIX,qqmusic.qq.com,QQMusic
DOMAIN,aqqmusic.tc.qq.com,QQMusic

# ---------- 腾讯动漫：专属业务域 → TencentComic 开关 ----------
DOMAIN,ac.qq.com,TencentComic
DOMAIN,m.ac.qq.com,TencentComic
DOMAIN,iphone.ac.qq.com,TencentComic
DOMAIN,comic.qq.com,TencentComic
DOMAIN-SUFFIX,ac.tc.qq.com,TencentComic
DOMAIN,manhua.acimg.cn,TencentComic
DOMAIN,static.ac.qq.com,TencentComic
DOMAIN,manhua.qpic.cn,TencentComic
DOMAIN,ugc.tc.qq.com,TencentComic

[Plugin]

# 仓库为 Public 时可直接使用 raw 地址；插件内没有 PROXY 规则，因此不需要 policy=。
# 若仓库改为私有，Loon 无法通过 raw 链接加载，需改用本地导入或单独的公开仓库。
https://raw.githubusercontent.com/justpp/loon_script/main/plugins/qqmusic-ads.plugin, enabled=true
https://raw.githubusercontent.com/justpp/loon_script/main/plugins/tencent-comic-ads.plugin, enabled=true
